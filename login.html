<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyAIFinder</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->

    <div class="nav-left">

    <!-- MENU -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- SPRACHE -->
    <div class="language-switcher">

        <button class="language-btn" onclick="toggleLanguageMenu()">
            <span id="currentLang">DE</span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="language-menu" id="languageMenu">
            <div onclick="changeLanguage('de','DE')">DE</div>
            <div onclick="changeLanguage('en','EN')">EN</div>
            <div onclick="changeLanguage('fr','FR')">FR</div>
            <div onclick="changeLanguage('ar','AR')">AR</div>
            <div onclick="changeLanguage('es','ES')">ES</div>
            <div onclick="changeLanguage('zh','中文')">中文</div>
        </div>

    </div>

    <!-- DARK MODE -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <i id="themeIcon" class="fa-regular fa-moon"></i>
    </button>

</div>


        <!-- LOGO -->

        <a href="index.html" class="brand-logo">

            <div class="logo-text">

                <span class="logo-my">
                    MyAI
                </span>

                <span class="logo-finder">
                    Finder
                </span>

            </div>

        </a>

        <!-- RECHTS -->

        <div class="nav-user">

            <a href="profil.html" class="nav-user-btn">

                <i class="fa-regular fa-user"></i>

                <span>Profil</span>

            </a>

            <a href="login.html" class="nav-user-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                <span>Login</span>

            </a>

            <a href="favoriten.html" class="nav-user-btn">

                <i class="fa-regular fa-heart"></i>

                <span>Favoriten</span>

            </a>

        </div>

    </nav>

    <!-- LOGIN CONTENT -->

    <main class="page-container">

        <div class="login-wrapper">

            <div class="login-card">

    <h1>Willkommen zurück</h1>

    <p class="login-subtitle">
        Login bei MyAIFinder
    </p>

    <input type="email" placeholder="E-Mail Adresse">

    <input type="password" placeholder="Passwort">

    <button class="login-btn">
        Einloggen
    </button>

    <p class="register-text">
        Noch kein Konto?
        <a href="#">Registrieren</a>
    </p>

    <!-- HIER SOCIAL LOGIN -->

    <div class="social-login">

        <button class="social-btn google-btn" type="button">
            <i class="fa-brands fa-google"></i>
            <span>Weiter mit Google</span>
        </button>

        <button class="social-btn github-btn" type="button">
            <i class="fa-brands fa-github"></i>
            <span>Weiter mit GitHub</span>
        </button>

    </div>

</div>

    </main>

    <script src="script.js"></script>

<body class="login-page">
</html>
