</p>

<div class="category-buttons">

  <script src="script.js"></script>
<script>
const input = document.querySelector("input");
const button = document.querySelector("button");

input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        button.click();
    }
});
</script>
