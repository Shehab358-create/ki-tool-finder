<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KI Tool Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<meta name='impact-site-verification' value='62bc03e2-eead-4b1f-a4fa-03dd1b575281'>
<body>

  <main class="container">
    <h1>Finde das beste KI-Tool für dein Problem</h1>

    <p class="subtitle">
      Gib ein, wobei du Hilfe brauchst – z.B. Lebenslauf, Bewerbung, Logo oder Texte.
    </p>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="z.B. Lebenslauf schreiben..." />
      <button onclick="searchTools()">Suchen</button>
    </div>
<div class="category-buttons">
  <button onclick="quickSearch('Lebenslauf')">Lebenslauf</button>
  <button onclick="quickSearch('Bewerbung')">Bewerbung</button>
  <button onclick="quickSearch('Logo')">Logo</button>
  <button onclick="quickSearch('Texte')">Texte</button>
</div>
    <div id="results" class="results"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
