<!DOCTYPE html>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <button class="menu-toggle">

                <span></span>
                <span></span>
            </button>

            <div class="language-switcher">

                <button class="language-btn">

                    <i class="fa-solid fa-chevron-down"></i>
                </button>

            </div>

            <button class="theme-toggle">
                <i class="fa-regular fa-moon"></i>

        </div>

        <a href="index.html" class="brand-logo">
